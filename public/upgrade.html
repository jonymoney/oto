<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>oto unlimited</title><link rel="icon" type="image/png" href="/icon.png">
<style>
  :root{--bg:#181A13;--ink:#EEF1E5;--muted:#99A189;--accent:#AACF53;--panel:#1F221A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:ui-monospace,'SF Mono',Menlo,monospace;text-align:center;padding:1.5rem}
  main{width:100%;max-width:26rem}
  h1{font-size:1.5rem;letter-spacing:.04em;margin:0 0 .5rem}
  .led{color:var(--accent)}
  p{line-height:1.6;color:var(--muted);font-size:.92rem}
  form{margin-top:1.5rem;display:flex;flex-direction:column;gap:.75rem}
  input{width:100%;padding:.7rem .8rem;background:var(--panel);border:1px solid #2C3025;border-radius:6px;
        color:var(--ink);font:inherit;text-align:center;letter-spacing:.05em}
  input:focus{outline:none;border-color:var(--accent)}
  button{padding:.7rem 1rem;background:var(--accent);color:#181A13;border:0;border-radius:6px;
         font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:1rem;min-height:1.2rem;font-size:.85rem}
  .btn{display:inline-block;margin-top:1.25rem;padding:.7rem 1.6rem;background:var(--accent);
       color:#181A13;border-radius:6px;font-weight:600;text-decoration:none}
  .err{color:#FF7D92}
  .hide{display:none}
</style></head><body><main>
  <h1><span class="led">◉</span> oto <span style="color:var(--muted)">unlimited</span></h1>
  <p id="lede">Generate without limits. Sign in with your email to subscribe.</p>

  <form id="emailForm">
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <button id="emailBtn" type="submit">Send code</button>
  </form>

  <form id="otpForm" class="hide">
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" required>
    <button id="otpBtn" type="submit">Continue to checkout</button>
  </form>

  <div id="msg" class="msg"></div>

<script>
  var qs = new URLSearchParams(location.search);
  var status = qs.get('status');
  var emailForm = document.getElementById('emailForm');
  var otpForm = document.getElementById('otpForm');
  var lede = document.getElementById('lede');
  var msg = document.getElementById('msg');
  var email = '';

  function say(text, isErr){ msg.textContent = text || ''; msg.className = 'msg' + (isErr ? ' err' : ''); }
  function show(el){ el.classList.remove('hide'); }
  function hide(el){ el.classList.add('hide'); }

  if (status === 'success') {
    hide(emailForm);
    lede.textContent = 'You are now on oto unlimited — thank you.';
    // Checkout opened from the iOS app lands here in Safari: bounce back to
    // the app via its URL scheme (auto once, plus a tap fallback). On desktop
    // the scheme means nothing, so only offer it on iPhone/iPad.
    if (/iPhone|iPad/.test(navigator.userAgent)) {
      var back = document.createElement('a');
      back.href = 'otoaudio://upgraded';
      back.className = 'btn';
      back.textContent = 'Back to oto';
      msg.parentNode.insertBefore(back, msg);
      setTimeout(function(){ location.href = 'otoaudio://upgraded'; }, 600);
    } else {
      lede.textContent += ' Head back to your chat and keep generating.';
    }
  } else if (status === 'cancel') {
    lede.textContent = 'Checkout canceled. No charge was made. You can subscribe whenever you like.';
  }

  emailForm.addEventListener('submit', async function(e){
    e.preventDefault();
    email = document.getElementById('email').value.trim();
    if (!email) return;
    document.getElementById('emailBtn').disabled = true;
    say('Sending code…');
    try {
      var r = await fetch('/api/auth/email-otp/send-verification-otp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, type: 'sign-in' }),
      });
      if (!r.ok) throw new Error('send failed');
      hide(emailForm); show(otpForm);
      say('We sent a 6-digit code to ' + email + '.');
      document.getElementById('otp').focus();
    } catch (err) {
      say('Could not send a code. Check the address and try again.', true);
      document.getElementById('emailBtn').disabled = false;
    }
  });

  otpForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var otp = document.getElementById('otp').value.trim();
    if (!otp) return;
    document.getElementById('otpBtn').disabled = true;
    say('Verifying…');
    try {
      var r = await fetch('/api/auth/sign-in/email-otp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, otp: otp }),
      });
      if (!r.ok) throw new Error('verify failed');
      var token = r.headers.get('set-auth-token');
      if (!token) { var body = await r.json().catch(function(){ return {}; }); token = body.token; }
      if (!token) throw new Error('no token');

      say('Starting checkout…');
      var c = await fetch('/api/billing/checkout', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + token },
      });
      if (c.status === 501) { say('Billing is not available yet. Please try again later.', true); return; }
      if (!c.ok) throw new Error('checkout failed');
      var data = await c.json();
      if (!data.url) throw new Error('no url');
      location.href = data.url;
    } catch (err) {
      say('That did not work. Double-check the code and try again.', true);
      document.getElementById('otpBtn').disabled = false;
    }
  });
</script>
</main></body></html>
